{% extends 'blog/base.html' %}
{% block content %}
{% for post in posts %}
    <header>
        <h1><a href="/">{{ post.author }}</a></h1>
    </header>

    <article>
        <time>{{ post.published_date }}</time>
        <h2><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h2>
        <p>{{ post.text|linebreaksbr }}</p>
    </article>
{% endfor %}
{% endblock %}

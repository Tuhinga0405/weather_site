{% extends 'base.html' %}

{% block content %}
{% load django_bootstrap5 %}

<div class="container py-5">
  <div class="row g-4">

    <!-- Карточка средней температуры -->
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-primary text-white text-center">
          <h5 class="mb-0">Средняя температура</h5>
        </div>
        <div class="card-body text-center">
          {{ avg_temp|safe }}
        </div>
      </div>
    </div>

    <!-- Карточка розы ветров -->
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-success text-white text-center">
          <h5 class="mb-0">Роза ветров</h5>
        </div>
        <div class="card-body">
          <div id="plot-container" style="width:100%; height:600px;">
            {{ roza|safe }}
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}

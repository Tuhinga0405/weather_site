{% extends 'base.html' %}

{% block content %}
{% load django_bootstrap5 %}

<div class="container mt-4">
  <h2 class="mb-3">Добавить устройство</h2>

  <form action="{% url 'add_device' %}" method="post" class="card p-4 shadow-sm">
    {% csrf_token %}

    <!-- Рендерим форму с bootstrap-оформлением -->
    {% bootstrap_form form layout='vertical' %}

    <div class="mt-3">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Добавить
      </button>
      <a href="{% url 'home_page' %}" class="btn btn-secondary">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
